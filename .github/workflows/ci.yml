name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check (zero-dependency, Node built-ins only)
        # 用 find 而不是 `for f in server.js tools/*.js`：拆出 lib/ 与 tools/lib/ 之后，
        # 写死目录的写法会静默漏检新模块（语法错在 CI 里看不见，只在运行时炸）。
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find . -name node_modules -prune -o -name '*.js' -print)
          exit $fail

      - name: Docs parity check (zh/en README section markers must match)
        run: node tools/verify-docs.js

      - name: Server-side checks (core, auth, limits, basics)
        run: |
          npm run verify:globals
          npm run verify:core
          npm run verify:auth
          npm run verify:limits
          npm run verify:basics

      - name: Smoke test (boot server, hit health endpoint)
        run: |
          PORT=18099 node server.js > /tmp/mock-server.log 2>&1 &
          SRV=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18099/_admin/health -o /dev/null 2>/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:18099/_admin/health || true
          echo "--- root (HTTP status) ---"
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:18099/ || true
          kill $SRV 2>/dev/null
          if [ "$ok" -ne 1 ]; then echo "SMOKE FAIL: server did not become healthy"; cat /tmp/mock-server.log; exit 1; fi
